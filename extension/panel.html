<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>履歷複製面板</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <div class="header-row">
        <nav class="tabs" role="tablist" aria-label="資料來源">
          <button data-tab="platform" role="tab" aria-selected="true" class="active">本站資料</button>
          <button data-tab="source" role="tab" aria-selected="false">原始資料</button>
        </nav>
        <button id="reload" title="重新抓取資料" aria-label="重新抓取資料">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 4v5h-5"></path></svg>
        </button>
      </div>
      <div class="controls">
        <label class="platform"><span>平台</span><select id="platform" aria-label="平台"></select></label>
        <div class="lang" role="group" aria-label="語言">
          <button data-lang="zh" aria-pressed="true" class="active">中</button>
          <button data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
      <p class="meta"><span class="meta-dot" aria-hidden="true"></span><span id="meta"></span></p>
    </header>
    <nav id="sections" aria-label="區段"></nav>
    <main id="content"><p class="status">載入中…</p></main>
    <script src="panel.js"></script>
  </body>
</html>
